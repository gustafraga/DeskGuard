[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "deskguard"
version = "0.2.0"
description = "Plataforma local de automação de Service Desk e diagnóstico de endpoints Windows."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "DeskGuard Project" }]
keywords = ["service-desk", "support", "diagnostics", "windows", "automation"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Environment :: Web Environment",
    "Intended Audience :: System Administrators",
    "Natural Language :: Portuguese (Brazilian)",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: System :: Systems Administration",
    "Topic :: System :: Monitoring",
]

dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "sqlalchemy>=2.0",
    "jinja2>=3.1",
    "pydantic>=2.9",
]

[project.optional-dependencies]
# Janela nativa do Windows (camada desktop). Opcional de proposito: a CLI e a
# interface web funcionam sem ela.
desktop = [
    "pywebview>=5.0",
]

# Ferramentas de empacotamento (executavel unico via PyInstaller).
build = [
    "pyinstaller>=6.0",
]

dev = [
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "httpx>=0.27",
    "pyinstaller>=6.0",
]

[project.scripts]
deskguard = "deskguard.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"deskguard.web" = [
    "templates/*.html",
    "static/css/*.css",
    "static/js/*.js",
]
"deskguard.collectors.scripts" = ["*.ps1"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra --strict-markers"
markers = [
    "integration: testes que exercitam a API HTTP com o cliente de teste",
    "live: testes que consultam o sistema operacional real (somente leitura)",
]
filterwarnings = ["error::DeprecationWarning:deskguard.*"]
